server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /healthz {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Presentation-only LLM proxy. Pollinations rejects direct browser calls
    # without a Turnstile token, but accepts this server-side request.
    location = /api/susai {
        proxy_pass https://text.pollinations.ai/openai;
        proxy_http_version 1.1;
        proxy_set_header Host text.pollinations.ai;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 25s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
